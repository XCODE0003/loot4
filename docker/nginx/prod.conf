server {
    listen 80;
    server_name loot4you.gg www.loot4you.gg;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://loot4you.gg$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name loot4you.gg;
    root /var/www/html/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/loot4you.gg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/loot4you.gg/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 50M;
    charset utf-8;

    location ^~ /build/ {
        alias /public_build/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend app:9000;
        fastcgi_pass $backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# Cloudflare-bypassing host for the IceNox payment webhook (DNS-only / grey cloud).
# Lets the gateway reach the origin directly with a valid cert.
server {
    listen 443 ssl;
    server_name hooks.loot4you.gg;
    root /var/www/html/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/hooks.loot4you.gg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hooks.loot4you.gg/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 2M;
    charset utf-8;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend app:9000;
        fastcgi_pass $backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
