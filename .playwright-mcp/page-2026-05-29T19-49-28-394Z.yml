- generic [ref=e2]:
  - 'heading "API Documentation: IceNox Pay Payment Creation" [level=1] [ref=e3]'
  - paragraph [ref=e4]: This page documents the API endpoint for creating a payment in the IceNox Payment System. The endpoint must be accessed using the POST method with authentication via a Bearer token, which is the Merchant API Key.
  - heading "API Endpoint" [level=2] [ref=e5]
  - code [ref=e7]: https://imp.icenox.com/api/payment/create/
  - heading "Request Method" [level=3] [ref=e8]
  - paragraph [ref=e9]: This API endpoint must be accessed via POST method.
  - heading "Authentication" [level=3] [ref=e10]
  - paragraph [ref=e11]: "Authentication is required for this request. Include the Merchant API key in the request header:"
  - code [ref=e13]: "Authorization: Bearer <your_api_key>"
  - heading "Additional Headers" [level=3] [ref=e14]
  - paragraph [ref=e15]: "Since the Data for this request has to be sent as JSON, make sure to define the Content-Type in the request header as well:"
  - code [ref=e17]: "Content-Type: application/json"
  - generic [ref=e18]:
    - heading "Example CURL Request" [level=2] [ref=e19]
    - code [ref=e21]: "curl -X POST https://imp.icenox.com/api/payment/create/ \\ -H \"Authorization: Bearer <your_api_key>\" \\ -H \"Content-Type: application/json\" \\ -d '{ \"paymentmethod\": \"cards\", \"orderid\": \"12345\", \"amount\": 10.00, \"shipping\": 1.50, \"discount\": 0.50, \"total\": 11.00, \"currency\": \"EUR\", \"product\": \"Example product\", \"customer_email\": \"customer@example.com\", \"customer_first_name\": \"John\", \"customer_last_name\": \"Doe\", \"customer_phone\": \"+15551234567\", \"customer_address\": \"{\\\"line1\\\":\\\"123 Main St\\\",\\\"line2\\\":\\\"Apt 4B\\\",\\\"city\\\":\\\"Anytown\\\",\\\"zip\\\":\\\"12345\\\",\\\"state\\\":\\\"CA\\\",\\\"country\\\":\\\"United States\\\",\\\"country_code\\\":\\\"US\\\",\\\"street\\\":\\\"Main St\\\",\\\"number\\\":\\\"123\\\",\\\"name\\\":{\\\"title\\\":\\\"Mr\\\",\\\"first\\\":\\\"John\\\",\\\"middle\\\":\\\"A\\\",\\\"last\\\":\\\"Doe\\\"}}\", \"customerid\": \"98765\", \"notification_url\": \"https://example.com/notification\", \"notification_mode\": \"default\", \"shippingmethod\": \"standard\", \"redirect_url\": \"https://example.com/success?orderid={orderId}&customerid={customerId}&paymentid={paymentId}\", \"express_redirect\": true }'"
