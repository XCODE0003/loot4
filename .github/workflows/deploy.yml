name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate wayfinder files
        run: |
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');" && php composer-setup.php --quiet
          php composer.phar install --no-dev --ignore-platform-reqs --no-interaction --no-progress --quiet
          php artisan wayfinder:generate --with-form

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Sync files to server
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='.env' \
            --exclude='storage/logs' \
            --exclude='storage/framework/cache' \
            --exclude='storage/framework/sessions' \
            --exclude='storage/framework/views' \
            --exclude='public/storage' \
            --exclude='public/hot' \
            --exclude='docker/certbot_certs' \
            ./ root@${{ secrets.SSH_HOST }}:/var/www/loot4you

      - name: Build & restart containers
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          timeout: 30m
          script: |
            set -e
            cd /var/www/loot4you
            docker compose -f docker-compose.prod.yml build --no-cache app queue
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force
            docker compose -f docker-compose.prod.yml exec -T --user www-data app php artisan optimize
            echo "Deploy complete"
